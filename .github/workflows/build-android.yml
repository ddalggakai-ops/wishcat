name: Build Android APK (EAS)

# Actions 탭에서 "Run workflow" 버튼을 눌러서 수동으로 실행합니다.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # 이 저장소에 연결된 EAS 프로젝트가 아직 없으면 새로 만들어 연결합니다.
      # (매번 새로 연결되어도 빌드 자체에는 문제 없어요 — Expo 계정 안에 프로젝트가
      #  여러 개 생길 수 있는 정도의 사소한 이슈입니다.)
      - name: Link EAS project
        run: eas init --non-interactive || true

      # distribution: internal 프로필이라 빌드가 끝나면 로그 마지막 줄 근처에
      # "Build details: https://expo.dev/accounts/.../builds/..." 링크가 떠요.
      # 그 링크를 폰 브라우저로 열면 QR코드/다운로드 버튼으로 APK를 바로 설치할 수 있어요.
      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive
