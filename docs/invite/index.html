<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>위시캣 초대 ✦</title>
<meta property="og:title" content="위시캣에 초대받았어요 ✦" />
<meta property="og:description" content="친구와 함께 지우는 버킷리스트, 위시캣" />
<meta property="og:type" content="website" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    background: linear-gradient(170deg, #7fb8ea 0%, #a9d2f2 45%, #e6f4fe 100%);
    color: #1b2a3d;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 360px; background: #fff; border-radius: 26px;
    padding: 30px 24px; text-align: center; box-shadow: 0 18px 40px rgba(30,60,100,.22);
  }
  .brand { font-size: 26px; font-weight: 800; margin: 0 0 6px; }
  .tag { font-size: 14px; color: #55677e; margin: 0 0 22px; line-height: 1.55; }
  .star { font-size: 46px; margin-bottom: 14px; }
  a.btn, button.btn {
    display: block; width: 100%; border: 0; cursor: pointer; text-decoration: none;
    border-radius: 16px; padding: 15px 16px; font-size: 15px; font-weight: 700;
    margin-top: 10px; font-family: inherit;
  }
  .primary { background: #4a90d9; color: #fff; }
  .ghost { background: #f1f5fa; color: #33465e; }
  .code {
    margin-top: 20px; font-size: 12px; color: #8496ab; word-break: break-all; line-height: 1.6;
  }
  .note { margin-top: 18px; font-size: 12.5px; color: #7b8ca1; line-height: 1.65; }
</style>
</head>
<body>
  <div class="card">
    <div class="star">✦</div>
    <h1 class="brand">위시캣 초대</h1>
    <p class="tag" id="tag">친구가 위시캣으로 초대했어요.<br />함께 버킷리스트를 지워봐요.</p>

    <a class="btn primary" id="open" href="#">앱에서 열기</a>
    <a class="btn ghost" id="install" href="https://github.com/ddalggakai-ops/wishcat/releases/latest">앱 설치하기 (APK)</a>

    <p class="note">
      앱을 설치한 뒤 이 링크를 한 번 더 누르면 초대가 이어집니다.
    </p>
    <p class="code" id="code"></p>
  </div>

<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var code = params.get('c') || '';
    var valid = /^[A-Za-z0-9_-]+$/.test(code);
    var openBtn = document.getElementById('open');

    if (!valid) {
      document.getElementById('tag').textContent = '초대 코드가 없는 링크예요. 친구에게 받은 링크를 다시 확인해주세요.';
      openBtn.style.display = 'none';
      return;
    }

    var deepLink = 'wishcat://invite/' + encodeURIComponent(code);
    openBtn.setAttribute('href', deepLink);
    document.getElementById('code').textContent = '초대 코드: ' + code;

    // 안드로이드에서는 인텐트 URL이 앱이 없을 때 알아서 조용히 실패하도록 해줍니다.
    if (/Android/i.test(navigator.userAgent)) {
      openBtn.setAttribute(
        'href',
        'intent://invite/' + encodeURIComponent(code) + '#Intent;scheme=wishcat;package=com.wishcat.app;end'
      );
    }
  })();
</script>
</body>
</html>
